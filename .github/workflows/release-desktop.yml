name: Release Desktop Applications (Cross-Platform)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release Tag (e.g. v0.5.2)"
        required: true
        default: "v0.5.2"

permissions:
  contents: write

jobs:
  build-desktop:
    name: 🖥️ Build Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: ""
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            args: ""
          - platform: "macos-latest"
            target: "universal-apple-darwin"
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build Desktop Application via Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name || inputs.release_tag }}
          releaseName: "DualCrypt Enterprise Desktop ${{ github.ref_name || inputs.release_tag }}"
          releaseBody: "Automated multi-platform production release for DualCrypt Threshold & Dual-Control Encryption Platform."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build Standalone CLI Binary (denc)
        run: cargo build --release -p denc-cli

      - name: Package CLI Binary (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: cp target/release/denc.exe ./denc-windows-x86_64.exe

      - name: Package CLI Binary (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cp target/release/denc ./denc-linux-x86_64
          chmod +x ./denc-linux-x86_64

      - name: Package CLI Binary (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          cp target/release/denc ./denc-macos-universal
          chmod +x ./denc-macos-universal

      - name: Upload Standalone CLI Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        with:
          tag_name: ${{ github.ref_name || inputs.release_tag }}
          files: |
            denc-windows-x86_64.exe
            denc-linux-x86_64
            denc-macos-universal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

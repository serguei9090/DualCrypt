name: Release Signed Android APK & App Bundle (AAB)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release Tag (e.g. v0.5.0)"
        required: true
        default: "v0.5.0"

permissions:
  contents: write

jobs:
  build-android-signed:
    name: 📱 Build & Sign Android APK & AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies & Build Web Assets
        run: |
          cd apps/mobile-android
          bun install --frozen-lockfile || bun install
          bun run build
          bunx cap sync android

      - name: Prepare Android Signing Keystore
        id: keystore-setup
        run: |
          mkdir -p $HOME/keystore
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using production signing keystore from GitHub Secrets..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > $HOME/keystore/release.jks
            echo "KEYSTORE_PATH=$HOME/keystore/release.jks" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Generating automated ephemeral release keystore..."
            RANDOM_PASS=$(openssl rand -hex 16)
            keytool -genkey -v \
              -keystore $HOME/keystore/release.jks \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias dualcrypt-key \
              -dname "CN=DualCrypt, OU=Security, O=DualCrypt, L=San Francisco, ST=CA, C=US" \
              -storepass "$RANDOM_PASS" \
              -keypass "$RANDOM_PASS"
            echo "KEYSTORE_PATH=$HOME/keystore/release.jks" >> $GITHUB_ENV
            echo "KEY_ALIAS=dualcrypt-key" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$RANDOM_PASS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$RANDOM_PASS" >> $GITHUB_ENV
          fi

      - name: Build Android Release APK & App Bundle (Signed & Protected)
        run: |
          cd apps/mobile-android/android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Collect & Brand Android Artifacts
        run: |
          mkdir -p dist-android
          # Copy release APK
          find apps/mobile-android/android/app/build/outputs/apk/release/ -type f -name "*.apk" -exec cp {} dist-android/DualCrypt.Enterprise_0.5.0.apk \;
          # Copy release AAB (App Bundle)
          find apps/mobile-android/android/app/build/outputs/bundle/release/ -type f -name "*.aab" -exec cp {} dist-android/DualCrypt.Enterprise_0.5.0.aab \;
          ls -lah dist-android

      - name: Verify Android Cryptographic Signatures
        run: |
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools/ -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"
          $APKSIGNER verify --verbose dist-android/DualCrypt.Enterprise_0.5.0.apk

      - name: Upload Android Build Artifacts (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: dualcrypt-android-packages
          path: dist-android/
          if-no-files-found: error

      - name: Attach Android Packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name || inputs.release_tag }}
          files: dist-android/*
          draft: false
          prerelease: false

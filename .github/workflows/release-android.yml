name: Release Signed Android APK & App Bundle (AAB)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release Tag (e.g. v0.5.4)"
        required: true
        default: "v0.5.4"

permissions:
  contents: write

jobs:
  build-android-signed:
    name: 📱 Build & Sign Android APK & AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies & Build Web Assets
        run: |
          cd apps/mobile-android
          bun install --frozen-lockfile || bun install
          bun run build
          bunx cap sync android

      - name: Prepare Android Signing Keystore
        run: |
          mkdir -p $HOME/keystore
          RELEASE_PASS="DualCrypt2026SecurePass!"
          keytool -genkeypair -v \
            -keystore $HOME/keystore/release.jks \
            -storetype PKCS12 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias dualcrypt \
            -dname "CN=DualCrypt, OU=Security, O=DualCrypt Enterprise, L=San Francisco, ST=CA, C=US" \
            -storepass "$RELEASE_PASS" \
            -keypass "$RELEASE_PASS"
          echo "KEYSTORE_PATH=$HOME/keystore/release.jks" >> $GITHUB_ENV
          echo "KEY_ALIAS=dualcrypt" >> $GITHUB_ENV
          echo "KEY_PASS=$RELEASE_PASS" >> $GITHUB_ENV

      - name: Build Android Release Artifacts (R8 Code Protected)
        run: |
          cd apps/mobile-android/android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Sign & Align Android Packages
        run: |
          mkdir -p dist-android
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools/ -name apksigner | sort -V | tail -n 1)
          ZIPALIGN=$(find $ANDROID_SDK_ROOT/build-tools/ -name zipalign | sort -V | tail -n 1)
          REL_TAG="${{ github.ref_name || inputs.release_tag || 'v0.5.1' }}"
          VERSION="${REL_TAG#v}"
          
          # 1. Align and Sign APK with v1, v2, v3, and v4 signatures
          RAW_APK=$(find apps/mobile-android/android/app/build/outputs/apk/release/ -type f -name "*.apk" | head -n 1)
          echo "Found raw APK: $RAW_APK"
          $ZIPALIGN -v -p 4 "$RAW_APK" "dist-android/DualCrypt.Enterprise_${VERSION}.apk"
          $APKSIGNER sign --ks "$KEYSTORE_PATH" --ks-pass pass:"$KEY_PASS" --key-pass pass:"$KEY_PASS" --ks-key-alias "$KEY_ALIAS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true "dist-android/DualCrypt.Enterprise_${VERSION}.apk"

          # 2. Sign AAB with jarsigner
          RAW_AAB=$(find apps/mobile-android/android/app/build/outputs/bundle/release/ -type f -name "*.aab" | head -n 1)
          echo "Found raw AAB: $RAW_AAB"
          cp "$RAW_AAB" "dist-android/DualCrypt.Enterprise_${VERSION}.aab"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$KEYSTORE_PATH" -storepass "$KEY_PASS" -keypass "$KEY_PASS" "dist-android/DualCrypt.Enterprise_${VERSION}.aab" "$KEY_ALIAS"

      - name: Verify Android Cryptographic Signatures
        run: |
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools/ -name apksigner | sort -V | tail -n 1)
          REL_TAG="${{ github.ref_name || inputs.release_tag || 'v0.5.1' }}"
          VERSION="${REL_TAG#v}"
          echo "=== APK Cryptographic Signature Verification ==="
          $APKSIGNER verify --verbose --print-certs "dist-android/DualCrypt.Enterprise_${VERSION}.apk"
          echo "=== AAB Cryptographic Signature Verification ==="
          jarsigner -verify -verbose -certs "dist-android/DualCrypt.Enterprise_${VERSION}.aab"

      - name: Upload Android Build Artifacts (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: dualcrypt-android-packages
          path: dist-android/
          if-no-files-found: error

      - name: Attach Android Packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name || inputs.release_tag }}
          files: dist-android/*
          draft: false
          prerelease: false

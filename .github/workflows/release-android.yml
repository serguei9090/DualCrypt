name: Release Signed Android APK & App Bundle (AAB)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release Tag (e.g. v2.0.0)"
        required: true
        default: "v2.0.0"

permissions:
  contents: write

jobs:
  build-android-signed:
    name: 📱 Build & Sign Android APK & AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build Tools
        run: |
          sdkmanager --install "ndk;27.1.12297006" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> $GITHUB_ENV

      - name: Install Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Root & Mobile Dependencies
        run: |
          bun install --frozen-lockfile || bun install
          cd apps/mobile-android
          bun install --frozen-lockfile || bun install

      - name: Build Mobile Frontend Assets
        run: |
          cd apps/mobile-android
          bun run build

      - name: Prepare Android Signing Keystore
        id: keystore-setup
        run: |
          mkdir -p $HOME/keystore
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using production signing keystore from GitHub Secrets..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > $HOME/keystore/release.jks
            echo "KEYSTORE_PATH=$HOME/keystore/release.jks" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Generating automated ephemeral release keystore..."
            RANDOM_PASS=$(openssl rand -hex 16)
            keytool -genkey -v \
              -keystore $HOME/keystore/release.jks \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias dualcrypt-key \
              -dname "CN=DualCrypt, OU=Security, O=DualCrypt, L=San Francisco, ST=CA, C=US" \
              -storepass "$RANDOM_PASS" \
              -keypass "$RANDOM_PASS"
            echo "KEYSTORE_PATH=$HOME/keystore/release.jks" >> $GITHUB_ENV
            echo "KEY_ALIAS=dualcrypt-key" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$RANDOM_PASS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$RANDOM_PASS" >> $GITHUB_ENV
          fi

      - name: Initialize Tauri Android Target (if needed)
        run: |
          bunx tauri android init --ci || true

      - name: Build Android APKs & App Bundles (Release)
        run: |
          bunx tauri android build --apk --aab --ci || true

      - name: Sign & Align Android Packages
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: src-tauri/gen/android/app/build/outputs/apk/universal/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ env.KEY_ALIAS }}
          keyStorePassword: ${{ env.KEYSTORE_PASSWORD }}
          keyPassword: ${{ env.KEY_PASSWORD }}
        continue-on-error: true

      - name: Collect Android Artifacts
        run: |
          mkdir -p dist-android
          find src-tauri/gen/android/app/build/outputs/ -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp {} dist-android/ \; || true
          ls -lah dist-android || true

      - name: Upload Android Build Artifacts (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: dualcrypt-android-packages
          path: dist-android/
          if-no-files-found: warn

      - name: Attach Android Packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name || inputs.release_tag }}
          files: dist-android/*
          draft: true
          prerelease: false

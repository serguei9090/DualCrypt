[package]
name = "dualcrypt-app"
version = "0.5.2"
description = "DualCrypt Enterprise - Zero-Trust Threshold File Encryption Platform"
authors = ["DualCrypt Enterprise"]
edition = "2021"

[lib]
name = "dual_encryption_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
denc-core = { path = "../crates/denc-core" }
tauri = { version = "2.2", features = [] }
tauri-plugin-dialog = "2.2"
tauri-plugin-fs = "2.2"
tauri-plugin-opener = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1.12", features = ["v4"] }
zeroize = { version = "1.8", features = ["derive"] }
sha2 = "0.10"
thiserror = "2.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport", "pool"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }
